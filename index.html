<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dizu — la plateforme</title>
<meta http-equiv="refresh" content="0; url=/paraboles/">
<style>
:root{--papier:#faf6ef;--creme:#f3ecdd;--or:#b98a2f;--rouge:#8c2f24;--brun:#6b5335;--encre:#2b2114}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papier);color:var(--encre);font-family:Georgia,'Times New Roman',serif;line-height:1.65;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.wrap{max-width:560px}
.orn{color:var(--or);font-size:1.2rem;letter-spacing:.6em;margin-bottom:16px}
h1{font-size:2.4rem;font-weight:normal;letter-spacing:.06em}
small{display:block;font-family:Inter,system-ui,sans-serif;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--brun);margin-top:6px}
.filet{width:120px;border:none;border-top:2px solid var(--or);margin:22px auto}
a{display:inline-block;font-family:Inter,system-ui,sans-serif;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;background:var(--rouge);color:#fff;text-decoration:none;padding:12px 26px;border-radius:4px}
a:hover{background:#6d241b}
p{font-size:.85rem;color:#4a3b26;margin-top:18px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="orn">❦ ❦ ❦</div>
    <h1>Dizu</h1>
    <small data-fr="La plateforme — œuvres, éducation &amp; services">The platform — works, education &amp; services</small>
    <hr class="filet">
    <a href="/paraboles/">Entrer dans Paraboles · Enter Paraboles</a>
    <p>Paraboles — the publishing house of the Dizu platform.</p>
  </div>
